# Supabase local development config (used by `supabase start` once Docker is available).
# Hosted projects are configured separately in their dashboards; nothing here touches them.
project_id = "gaming-hall-saas"

[api]
enabled = true
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

# Google OAuth is the only sign-in method (spec §5). Secrets come from the environment, never the repo.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[functions.signup-otp]
# Called before sign-in with a publishable key; the function enforces its own limits.
verify_jwt = false

[functions.agent-bridge]
# Authenticated by its own hall-server token (SHA-256 checked in the database), not by a Supabase JWT.
verify_jwt = false
